name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI (Go, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  cloud:
    name: Cloud (Workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the site
        run: bun install --frozen-lockfile && bun run build
        working-directory: cloud/site
      - name: Build the app
        run: bun install --frozen-lockfile && bun run build
        working-directory: cloud/app
      - run: bunx wrangler types
      - run: bunx tsc --noEmit && bunx tsc --noEmit -p test/node
      - run: bunx vitest run
